<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nest4Us Email Template</title>

    <style>
      body {
        background: #222;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }

      .email-container {
        max-width: 600px;
        margin: 30px auto;
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
      }

      .header {
        background: #5a0f8d;
        padding: 40px 20px 60px;
        text-align: center;
        position: relative;
      }

      .logo-wrapper {
        width: 70px;
        height: 70px;
        /*background: #ffffff;*/
        /*border-radius: 50%;*/
        display: flex;
        justify-content: center;
        align-items: center;

        position: absolute;
        left: 50%;
        bottom: 15px;
        transform: translateX(-50%);
        /*box-shadow: 0px 3px 6px rgba(0,0,0,0.15);*/
      }

      .logo-wrapper img {
        width: 60px;
        height: 60px;
      }

      .content {
        padding: 60px 30px 40px;
        font-size: 15px;
        color: #333;
        line-height: 1.6;
      }

      .button {
        display: inline-block;
        background: #5a0f8d;
        padding: 10px 24px;
        text-decoration: none;
        color: #000;
        border-radius: 6px;
        font-weight: 600;
        margin: 15px 0 25px;
        color: #fff;
      }

      /* SOCIAL FOOTER */
      .social-footer {
        background: #5a0f8d;
        padding: 1px 10px 15px 5px;
        text-align: center;
        color: #fff;
      }

      .social-footer h3 {
        font-size: 15px;
        letter-spacing: 1px;
        margin-bottom: 18px;
        color: #fff;
      }

      .social-icons {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 18px;
      }

      .social-icon {
        width: 42px;
        height: 42px;
        background: #ffffff;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .social-icon img {
        width: 22px;
      }
    </style>
  </head>

  <body>
    <div class="email-container">
      <div class="header">
        <div class="logo-wrapper">
          <img src="https://ngo-node-js.onrender.com/uploads/logo/logo.png" alt="Nest4Us Logo" />
        </div>
      </div>

      <div class="content">
        <p>Hi {{name}},</p>

        <p>{{bodyText}}</p>

        <p>Thank you!</p>

        <p><strong>NEST4US Team</strong></p>
      </div>

      <div class="social-footer">
        <h3>FOLLOW US ON</h3>

        <div class="social-icons">
          <div class="social-icon">
            <a href="https://www.facebook.com/nest4us" target="_blank">
              <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook" />
            </a>
          </div>

          <div class="social-icon">
            <a href="https://www.instagram.com/joinnest" target="_blank">
              <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram" />
            </a>
          </div>

          <div class="social-icon">
            <a href="https://www.twitter.com/joinnest4" target="_blank">
              <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter" />
            </a>
          </div>

          <div class="social-icon">
            <a href="https://www.youtube.com/@nest4us593" target="_blank">
              <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube" />
            </a>
          </div>

          <div class="social-icon">
            <a href="https://www.tiktok.com/@nest4us" target="_blank">
              <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok" />
            </a>
          </div>

          <div class="social-icon">
            <a href="https://www.linkedin.com/company/nest4us/" target="_blank">
              <img src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png" alt="LinkedIn" />
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
