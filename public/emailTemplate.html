<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nest4Us Email Template</title>

    <style>
      body {
        background: #222;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }

      .email-container {
        max-width: 600px;
        margin: 30px auto;
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
      }

      .header {
        background: #5a0f8d;
        padding: 40px 20px 60px;
        text-align: center;
        position: relative;
      }

      .logo-wrapper {
        width: 70px;
        height: 70px;
        display: block;
        margin: 0 auto;
        position: absolute;
        left: 50%;
        bottom: 15px;
        transform: translateX(-50%);
      }

      .logo-wrapper img {
        width: 60px;
        height: 60px;
        display: block;
      }

      .content {
        padding: 60px 30px 40px;
        font-size: 15px;
        color: #333;
        line-height: 1.6;
      }

      .button {
        display: inline-block;
        background: #5a0f8d;
        padding: 10px 24px;
        text-decoration: none;
        color: #fff;
        border-radius: 6px;
        font-weight: 600;
        margin: 15px 0 25px;
      }

      /* SOCIAL FOOTER - Using table layout for better email client support */
      .social-footer {
        background: #5a0f8d;
        padding: 20px 10px 25px;
        text-align: center;
        color: #fff;
      }

      .social-footer h3 {
        font-size: 15px;
        letter-spacing: 1px;
        margin: 0 0 20px 0;
        color: #fff;
      }

      .social-icons-table {
        margin: 0 auto;
      }

      .social-icon {
        width: 42px;
        height: 42px;
        background: #ffffff;
        border-radius: 50%;
        display: inline-block;
        text-align: center;
        line-height: 42px;
        margin: 0 6px;
      }

      .social-icon img {
        width: 22px;
        height: 22px;
        vertical-align: middle;
        display: inline-block;
      }

      .social-icon a {
        display: block;
        width: 100%;
        height: 100%;
        line-height: 42px;
      }
    </style>
  </head>

  <body>
    <div class="email-container">
      <div class="header">
        <div class="logo-wrapper">
          <img src="https://ngo-node-js.onrender.com/uploads/logo/logo.png" alt="Nest4Us Logo" />
        </div>
      </div>

      <div class="content">
        <p>Hi {{name}},</p>

        <p>{{bodyText}}</p>

        <p>Thank you!</p>

        <p><strong>NEST4US Team</strong></p>
      </div>

      <div class="social-footer">
        <h3>FOLLOW US ON</h3>

        <!-- Using table for better email client compatibility -->
        <table class="social-icons-table" border="0" cellpadding="0" cellspacing="0" align="center">
          <tr>
            <td style="padding: 0 6px">
              <div class="social-icon">
                <a href="https://www.facebook.com/nest4us" target="_blank">
                  <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook" />
                </a>
              </div>
            </td>
            <td style="padding: 0 6px">
              <div class="social-icon">
                <a href="https://www.instagram.com/joinnest" target="_blank">
                  <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram" />
                </a>
              </div>
            </td>
            <td style="padding: 0 6px">
              <div class="social-icon">
                <a href="https://www.twitter.com/joinnest4" target="_blank">
                  <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter" />
                </a>
              </div>
            </td>
            <td style="padding: 0 6px">
              <div class="social-icon">
                <a href="https://www.youtube.com/@nest4us593" target="_blank">
                  <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube" />
                </a>
              </div>
            </td>
            <td style="padding: 0 6px">
              <div class="social-icon">
                <a href="https://www.tiktok.com/@nest4us" target="_blank">
                  <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok" />
                </a>
              </div>
            </td>
            <td style="padding: 0 6px">
              <div class="social-icon">
                <a href="https://www.linkedin.com/company/nest4us/" target="_blank">
                  <img src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png" alt="LinkedIn" />
                </a>
              </div>
            </td>
          </tr>
        </table>
      </div>
    </div>
  </body>
</html>
